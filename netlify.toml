[build]
  publish = "."

# Netlify Identity pro přihlašování do administrace
[[plugins]]
  package = "@netlify/plugin-netlify-identity"

# Bezpečnostní hlavičky
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Admin stránka
[[headers]]
  for = "/admin/*"
  [headers.values]
    X-Robots-Tag = "noindex"
